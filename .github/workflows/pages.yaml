---


name: Pages

"on":
  # The API documentation is generated from the code, so code changes matter too
  pull_request:
    paths:
      - "docs/**"
      - "mxcubecore/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "conda-environment-dev.yml"
      - ".github/workflows/pages.yaml"
      - ".github/actions/install_core/**"
  push:
    branches:
      - develop
  workflow_dispatch: null

jobs:

  pages-build:

    runs-on: ubuntu-24.04
    permissions:
      contents: read

    # Cancel outdated runs of the same pull request, but never runs on branches
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          # With shallow clone the "Last updated" timestamp can not get computed
          # See "Caveats" at https://pypi.org/project/sphinx-last-updated-by-git
          fetch-depth: 0

      - name: Install mxcubecore with the docs dependencies
        uses: ./.github/actions/install_core
        with:
          poetry-groups: docs,main

      - name: Build documentation with Sphinx
        run: >
          ${MAMBA_EXE} run --name mxcubecore
          make --directory=./docs/ html

      - name: Upload artifact for GitHub Pages
        # This could potentially be run only when we intend to deploy...
        # ...but it can be useful to have the artifact for debugging
        # if: "github.ref_name == github.event.repository.default_branch"
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  pages-deploy:

    if: github.ref_name == github.event.repository.default_branch

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs:
      - pages-build

    permissions:
      pages: write
      id-token: write

    runs-on: ubuntu-24.04

    # Only one deployment at a time, and never cancel one in progress
    concurrency:
      group: pages-deploy
      cancel-in-progress: false

    steps:

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


...
