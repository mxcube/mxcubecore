---

name: Linting & Code Quality

"on":
  pull_request:
    types: [opened, reopened, synchronize]

env:
  # Keep in sync with `pyproject.toml` and `.pre-commit-config.yaml`
  POETRY_VERSION: "2.5.1"

jobs:

  pre-commit:

    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Conda environment with Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          cache-environment: true
          create-args: >-
            python=3.11
          environment-file: conda-environment-dev.yml
          micromamba-version: 1.5.10-0
          post-cleanup: all

      - name: Install Poetry
        # Poetry lives in its own isolated environment, not in the Conda environment.
        # Run from inside the Conda environment, it installs into that environment.
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"

      - name: Install Python dependencies
        run: >
          ${MAMBA_EXE} run --name mxcubecore
          poetry install --only=dev

      - name: Run Pre-Commit hooks
        run: >
          ${MAMBA_EXE} run --name mxcubecore
          pre-commit run --all-files --show-diff-on-failure

...
