---

name: Linting & Code Quality

"on":
  pull_request: null
  merge_group: null
  push:
    branches:
      - develop
      - master
  workflow_dispatch: null

# Cancel outdated runs of the same pull request, but never runs on branches
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:

  pre-commit:

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      # All hooks run in their own isolated environments managed by pre-commit,
      # so neither Conda nor the project's dependencies are needed here.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run Pre-Commit hooks
        run: >-
          pipx run --spec "pre-commit>=4.1,<5"
          pre-commit run --all-files --show-diff-on-failure

...
