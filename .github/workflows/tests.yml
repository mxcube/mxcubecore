---

name: Pytest

"on":
  pull_request:
    types: [opened, reopened, synchronize]

env:
  # Keep in sync with `pyproject.toml` and `.pre-commit-config.yaml`
  POETRY_VERSION: "2.5.1"

jobs:

  Python:

    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      matrix:
        python-version:
          - "3.11"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: >-
          Setup Conda environment with Micromamba
          for Python ${{ matrix.python-version }}
        uses: mamba-org/setup-micromamba@v2
        with:
          cache-environment: true
          create-args: >-
            python=${{ matrix.python-version }}
          environment-file: conda-environment-dev.yml
          micromamba-version: 1.5.10-0
          post-cleanup: all

      - name: Install Poetry
        # Poetry lives in its own isolated environment, not in the Conda environment.
        # Run from inside the Conda environment, it installs into that environment.
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"

      - name: Install dependencies
        run: >
          ${MAMBA_EXE} run --name mxcubecore
          poetry install --only=dev,main

      - name: Test with pytest
        run: >
          ${MAMBA_EXE} run --name mxcubecore
          pytest --no-cov
