---

name: Pytest

"on":
  pull_request: null
  merge_group: null
  push:
    branches:
      - develop
      - master
  workflow_dispatch: null

# Cancel outdated runs of the same pull request, but never runs on branches
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:

  Python:

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mxcubecore for Python ${{ matrix.python-version }}
        uses: ./.github/actions/install_core
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test with pytest
        run: >
          ${MAMBA_EXE} run --name mxcubecore
          pytest --no-cov

...
